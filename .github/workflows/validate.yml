name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: JSON validation
        run: python -c "import json; [json.load(open(f)) for f in ['custom_components/ocis/manifest.json','custom_components/ocis/strings.json','custom_components/ocis/translations/en.json','custom_components/ocis/icons.json','hacs.json']]"
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
